name: 'Gemini PR Review'

on:
  pull_request:
    types: [opened, reopened, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Số thứ tự PR cần review'
        required: true
        type: string
      force_deep_review:
        description: 'Ép chạy Bước 2 (review chuyên sâu + fallback)'
        required: false
        default: true
        type: boolean

# Hủy lượt chạy cũ nếu cùng PR có trigger mới chồng lên
concurrency:
  group: '${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number }}'
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    # Bỏ qua Draft PR; với sự kiện labeled chỉ chạy khi gắn nhãn "deep-review" để tránh tốn quota
    if: >-
      !github.event.pull_request.draft &&
      (github.event_name != 'pull_request' ||
       github.event.action != 'labeled' ||
       github.event.label.name == 'deep-review')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Run 2-Stage Gemini PR Review
        shell: bash
        env:
          GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          GITHUB_REPOSITORY: '${{ github.repository }}'
          PR_NUMBER: '${{ github.event.pull_request.number || inputs.pr_number }}'
          FORCE_DEEP_REVIEW: ${{ (github.event_name == 'workflow_dispatch' && inputs.force_deep_review) || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'deep-review') }}
          GEMINI_TRIAGE_MODELS: ${{ vars.GEMINI_TRIAGE_MODELS || 'gemini-3.5-flash-lite,gemini-3.8-flash' }}
          GEMINI_DEEP_MODELS: ${{ vars.GEMINI_DEEP_MODELS || 'gemini-4-hydrogen,gemini-3.8-flash,gemini-3.5-flash-lite' }}
        run: python3 .github/scripts/gemini_pr_review.py
