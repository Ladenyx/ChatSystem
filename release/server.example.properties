# Copy this file to ./config/server.properties (or ./release/config/server.properties)
# and replace every REPLACE_WITH_* placeholder before starting server.jar.
# Never commit real passwords, SMTP App Passwords, or API keys to Git.

# ---------------------------------------------------------------------------
# 1. Server Network & Optional HTTPS/WSS (PKCS12 Keystore)
# ---------------------------------------------------------------------------
# Keep server.ssl.enabled=false for local HTTP/WS loopback development (127.0.0.1:8080).
# Set server.ssl.enabled=true and configure a PKCS12 keystore when running TLS directly.
server.address=127.0.0.1
server.port=8080
server.ssl.enabled=false
# server.ssl.key-store-type=PKCS12
# server.ssl.key-store=file:./config/server-keystore.p12
# server.ssl.key-store-password=REPLACE_WITH_KEYSTORE_PASSWORD
# server.ssl.key-alias=chatsystem

# ---------------------------------------------------------------------------
# 2. PostgreSQL 18 Datasource
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://127.0.0.1:55432/chatsystem
spring.datasource.username=chatsystem
spring.datasource.password=REPLACE_WITH_POSTGRES_PASSWORD
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000

# ---------------------------------------------------------------------------
# 3. WebSocket, Heartbeat & Presence
# ---------------------------------------------------------------------------
chatsystem.ws.heartbeat-interval-sec=25
chatsystem.ws.heartbeat-timeout-sec=60
chatsystem.ws.presence-offline-grace-sec=10
chatsystem.ws.sync-buffer-size-per-user=500
chatsystem.ws.allowed-origins=*

# ---------------------------------------------------------------------------
# 4. Gmail SMTP (Email Verification & Password Reset)
# ---------------------------------------------------------------------------
chatsystem.smtp.host=smtp.gmail.com
chatsystem.smtp.port=587
chatsystem.smtp.username=REPLACE_WITH_GMAIL_ADDRESS
chatsystem.smtp.password=REPLACE_WITH_GMAIL_APP_PASSWORD

# ---------------------------------------------------------------------------
# 5. Meta Model API (LLM Assistant U-27)
# ---------------------------------------------------------------------------
chatsystem.llm.base-url=https://api.meta.ai/v1
chatsystem.llm.model=muse-spark-1.3-contributor
chatsystem.llm.api-key=REPLACE_WITH_META_API_KEY
chatsystem.llm.timeout-sec=15
