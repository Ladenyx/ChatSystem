# Copy this file to ./config/client.properties (or pass -Dchatsystem.client.config=path/to/client.properties)
# for User Client / Admin App. Database, SMTP, and LLM credentials belong ONLY on the server.

chatsystem.server.base-url=http://127.0.0.1:8080
chatsystem.server.connect-timeout-sec=5
chatsystem.server.request-timeout-sec=20

# Optional custom PKCS12 truststore when connecting directly to a self-signed HTTPS/WSS server:
# chatsystem.server.tls-trust-store=./config/client-truststore.p12
# chatsystem.server.tls-trust-store-password=REPLACE_WITH_TRUSTSTORE_PASSWORD
