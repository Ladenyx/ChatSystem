spring.application.name=chatsystem-server

# Default loopback HTTP/WS for local development; external config can enable PKCS12 TLS.
server.address=127.0.0.1
server.port=8080
server.ssl.enabled=false
server.error.whitelabel.enabled=false

# External configuration files (gitignored; loaded if present)
spring.config.import=optional:file:./config/server.properties,optional:file:./release/config/server.properties

# PostgreSQL 18 datasource (real credentials belong in external config or environment)
spring.datasource.url=jdbc:postgresql://127.0.0.1:55432/chatsystem
spring.datasource.username=chatsystem
spring.datasource.password=${CHATSYSTEM_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000

# WebSocket & Presence tuning (websocket-protocol.md)
chatsystem.ws.heartbeat-interval-sec=25
chatsystem.ws.heartbeat-timeout-sec=60
chatsystem.ws.presence-offline-grace-sec=10
chatsystem.ws.sync-buffer-size-per-user=500
chatsystem.ws.allowed-origins=*

# Gmail SMTP integration placeholders (populated in external config)
chatsystem.smtp.host=smtp.gmail.com
chatsystem.smtp.port=587
chatsystem.smtp.username=
chatsystem.smtp.password=

# Meta Model API (LLM Assistant) placeholders (populated in external config)
chatsystem.llm.base-url=https://api.meta.ai/v1
chatsystem.llm.model=muse-spark-1.3-contributor
chatsystem.llm.api-key=
chatsystem.llm.timeout-sec=15
